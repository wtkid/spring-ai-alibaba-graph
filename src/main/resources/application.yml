server:
  port: 8888
  servlet:
    encoding:
      charset: UTF-8
      force-response: true

spring:
  ai:
    openai:
      base-url: http://192.168.2.16:12434
      api-key: not-needed
      chat:
        completions-path: /v1/chat/completions
        options:
          model: ai/qwen3:4B-UD-Q4_K_XL
      embedding:
        embeddings-path: /v1/embeddings
        options:
          model: ai/qwen3-embedding:4B-Q4_K_M